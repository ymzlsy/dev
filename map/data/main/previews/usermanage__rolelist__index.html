<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>usermanage/rolelist — 角色列表 线框预览</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f7fa; color: #303133; font-size: 13px; }
  .ai-banner { height: 28px; line-height: 28px; background: #E6A23C; color: #fff; font-size: 12px; text-align: center; }
  .wrap { padding: 14px; }
  .card { background: #fff; border: 1px solid #ebeef5; border-radius: 4px; box-shadow: 0 2px 4px rgba(0,0,0,.04); }
  .card-header { padding: 14px 20px; border-bottom: 1px solid #ebeef5; font-size: 15px; font-weight: 600; }
  .card-body { padding: 16px 20px; }
  .actions-wrap { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  .input { height: 30px; border: 1px solid #dcdfe6; border-radius: 4px; background: #fff; padding: 0 8px; color: #c0c4cc; line-height: 28px; }
  .btn { display: inline-block; height: 30px; line-height: 28px; padding: 0 12px; border-radius: 4px; border: 1px solid #dcdfe6; background: #fff; color: #606266; font-size: 12px; }
  .btn-primary { background: #409EFF; border-color: #409EFF; color: #fff; }
  table { width: 100%; border-collapse: collapse; }
  th { background: #f5f7fa; color: #606266; font-weight: 600; padding: 10px 8px; border-bottom: 1px solid #ebeef5; text-align: left; font-size: 13px; }
  td { padding: 12px 8px; border-bottom: 1px solid #ebeef5; text-align: left; }
  .ph { display: inline-block; height: 12px; background: #e4e7ed; border-radius: 3px; vertical-align: middle; }
  .link { color: #409EFF; margin-right: 8px; }
  .pager { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 16px 0 4px; color: #606266; font-size: 12px; }
  .pg { width: 26px; height: 26px; line-height: 24px; text-align: center; border: 1px solid #dcdfe6; border-radius: 4px; background: #fff; }
  .pg.on { background: #409EFF; border-color: #409EFF; color: #fff; }
  .note { color: #909399; font-size: 12px; padding: 10px 20px 14px; }
</style>
</head>
<body>
<div class="ai-banner">&#9888; AI 根据源码重建的结构示意图，非真实运行截图</div>
<div class="wrap">
  <div class="card">
    <div class="card-header">角色列表</div>
    <div class="card-body">
      <!-- 查询栏 + 右侧新增按钮 -->
      <div class="actions-wrap">
        <div>
          <div class="input" style="width:200px;display:inline-block;vertical-align:middle;margin-right:10px">角色名称</div>
          <span class="btn btn-primary">查询</span>
        </div>
        <span class="btn btn-primary">+ 新增角色</span>
      </div>
      <!-- 表格 -->
      <table>
        <thead>
          <tr>
            <th style="width:55px">序号</th>
            <th style="width:150px">角色名称</th>
            <th>权限</th>
            <th style="width:160px">编码</th>
            <th style="width:160px">创建时间</th>
            <th style="width:130px">创建人</th>
            <th style="width:160px">操作</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1</td>
            <td><span class="ph" style="width:80px"></span></td>
            <td><span class="ph" style="width:80%"></span></td>
            <td><span class="ph" style="width:90px"></span></td>
            <td><span class="ph" style="width:110px"></span></td>
            <td><span class="ph" style="width:60px"></span></td>
            <td><span class="link">修改</span><span class="link">删除</span><span class="link">数据权限</span></td>
          </tr>
          <tr>
            <td>2</td>
            <td><span class="ph" style="width:80px"></span></td>
            <td><span class="ph" style="width:65%"></span></td>
            <td><span class="ph" style="width:90px"></span></td>
            <td><span class="ph" style="width:110px"></span></td>
            <td><span class="ph" style="width:60px"></span></td>
            <td><span class="link">修改</span><span class="link">删除</span><span class="link">数据权限</span></td>
          </tr>
        </tbody>
      </table>
      <!-- 分页器 -->
      <div class="pager">
        <span>共 <b>—</b> 条</span>
        <span class="pg">‹</span><span class="pg on">1</span><span class="pg">2</span><span class="pg">3</span><span class="pg">›</span>
        <div class="input" style="width:90px;height:26px;line-height:24px;font-size:12px">10条/页</div>
      </div>
    </div>
  </div>
  <div class="note">说明：页面还包含「新增/修改角色」右侧抽屉（角色名称、角色编码、菜单权限树）和「分配数据权限」弹窗（含部门树），此处未绘制。</div>
</div>
</body>
</html>
