<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>多媒体资源 — 线框预览</title>
<style>
body{margin:0;font-family:"PingFang SC","Helvetica Neue",Arial,sans-serif;background:#f0f2f5;color:#303133;font-size:13px;}
.warn{height:28px;line-height:28px;background:#E6A23C;color:#fff;font-size:12px;text-align:center;}
.app-container{background:#fff;margin:12px;padding:0 32px 20px;border:1px solid #ebeef5;border-radius:4px;}
.tabs{display:flex;border-bottom:2px solid #e4e7ed;margin-bottom:16px;}
.tab{padding:14px 24px;color:#303133;position:relative;}
.tab.active{color:#409EFF;font-weight:600;}
.tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:#409EFF;}
.filter{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.left{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.input{height:30px;line-height:30px;border:1px solid #dcdfe6;border-radius:4px;padding:0 10px;color:#c0c4cc;background:#fff;width:180px;}
.select{height:30px;line-height:30px;border:1px solid #dcdfe6;border-radius:4px;padding:0 24px 0 10px;background:#fff;position:relative;color:#606266;}
.select::after{content:"▾";position:absolute;right:8px;color:#c0c4cc;}
.btn{display:inline-block;height:30px;line-height:30px;padding:0 12px;border-radius:4px;font-size:12px;}
.btn-primary{background:#409EFF;color:#fff;}
.btn-danger{background:#F56C6C;color:#fff;opacity:.6;}
.section-note{color:#909399;font-size:12px;margin:6px 0 10px;}
.waterfall{display:flex;gap:16px;flex-wrap:wrap;}
.thumb{border-radius:4px;background:#e4e7ed;position:relative;}
.thumb .cb{position:absolute;top:8px;left:8px;width:14px;height:14px;border:1px solid #fff;border-radius:2px;background:rgba(255,255,255,.8);}
.divider{border-top:1px dashed #dcdfe6;margin:24px 0 12px;position:relative;}
.divider span{position:absolute;top:-9px;left:16px;background:#fff;padding:0 8px;color:#909399;font-size:12px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:#f5f7fa;color:#909399;font-weight:600;text-align:left;padding:10px 8px;border-bottom:1px solid #ebeef5;white-space:nowrap;}
td{padding:12px 8px;border-bottom:1px solid #ebeef5;}
tr.stripe td{background:#fafafa;}
.bar{display:inline-block;height:12px;border-radius:2px;background:#e4e7ed;}
.link{color:#409EFF;}
.cb2{width:14px;height:14px;border:1px solid #dcdfe6;border-radius:2px;background:#fff;display:inline-block;}
.pagination{display:flex;justify-content:flex-end;align-items:center;gap:6px;padding:14px 0 4px;color:#606266;}
.page{width:26px;height:26px;line-height:26px;text-align:center;border-radius:4px;background:#f4f4f5;}
.page.active{background:#409EFF;color:#fff;}
</style>
</head>
<body>
<div class="warn">⚠ AI 根据源码重建的结构示意图，非真实运行截图</div>
<div class="app-container">

  <!-- 顶部 Tab 页签 -->
  <div class="tabs">
    <div class="tab active">图片类</div>
    <div class="tab">视频类</div>
  </div>

  <!-- 「图片类」Tab 内容（Image 组件） -->
  <div class="filter">
    <div class="left">
      <span class="input">图片名称</span>
      <span class="btn btn-primary">查询</span>
      <span class="btn btn-primary">＋ 添加图片</span>
      <span class="btn btn-danger">批量删除</span>
    </div>
    <span class="select">缩略图模式</span>
  </div>

  <div class="section-note">缩略图模式：图片瀑布流（每张图左上角带选择框）</div>
  <div class="waterfall">
    <div class="thumb" style="width:160px;height:110px"><span class="cb"></span></div>
    <div class="thumb" style="width:110px;height:110px"><span class="cb"></span></div>
    <div class="thumb" style="width:190px;height:110px"><span class="cb"></span></div>
    <div class="thumb" style="width:140px;height:110px"><span class="cb"></span></div>
    <div class="thumb" style="width:170px;height:110px"><span class="cb"></span></div>
  </div>

  <div class="divider"><span>切换为「列表模式」时显示下方表格</span></div>

  <table>
    <thead>
      <tr>
        <th style="width:40px"><span class="cb2"></span></th>
        <th>图片名称</th>
        <th style="width:160px">资源分类</th>
        <th style="width:120px">文件大小</th>
        <th>上传时间</th>
        <th>上传人</th>
        <th style="width:120px">操作</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td><span class="cb2"></span></td>
        <td><span class="link"><span class="bar" style="width:70%;background:#d9ecff"></span></span></td>
        <td><span class="bar" style="width:60%"></span></td>
        <td><span class="bar" style="width:50%"></span></td>
        <td><span class="bar" style="width:70%"></span></td>
        <td><span class="bar" style="width:50%"></span></td>
        <td><span class="link">删除</span></td>
      </tr>
      <tr class="stripe">
        <td><span class="cb2"></span></td>
        <td><span class="link"><span class="bar" style="width:55%;background:#d9ecff"></span></span></td>
        <td>--</td>
        <td><span class="bar" style="width:45%"></span></td>
        <td><span class="bar" style="width:70%"></span></td>
        <td><span class="bar" style="width:50%"></span></td>
        <td><span class="link">删除</span></td>
      </tr>
    </tbody>
  </table>

  <div class="pagination">
    <span>共 ‒‒ 条</span>
    <span class="page">‹</span>
    <span class="page active">1</span>
    <span class="page">2</span>
    <span class="page">›</span>
  </div>

</div>
</body>
</html>
