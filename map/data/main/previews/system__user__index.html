<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>system/user — 用户管理 线框预览</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f7fa; color: #303133; font-size: 13px; }
  .ai-banner { height: 28px; line-height: 28px; background: #E6A23C; color: #fff; font-size: 12px; text-align: center; }
  .page { background: #fff; padding: 16px 20px; }
  .search-bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 14px; }
  .field { display: flex; align-items: center; gap: 6px; }
  .field label { color: #606266; white-space: nowrap; }
  .input { width: 180px; height: 30px; border: 1px solid #dcdfe6; border-radius: 4px; background: #fff; padding: 0 8px; color: #c0c4cc; line-height: 28px; }
  .select::after { content: "▾"; float: right; color: #c0c4cc; }
  .btn { display: inline-block; height: 30px; line-height: 28px; padding: 0 12px; border-radius: 4px; border: 1px solid #dcdfe6; background: #fff; color: #606266; font-size: 12px; }
  .btn-primary { background: #409EFF; border-color: #409EFF; color: #fff; }
  .btn-success { background: #67C23A; border-color: #67C23A; color: #fff; }
  .btn-danger  { background: #F56C6C; border-color: #F56C6C; color: #fff; }
  .btn-info    { background: #909399; border-color: #909399; color: #fff; }
  .btn-warning { background: #E6A23C; border-color: #E6A23C; color: #fff; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 14px; }
  table { width: 100%; border-collapse: collapse; }
  th { background: #f5f7fa; color: #606266; font-weight: 600; padding: 10px 8px; border-bottom: 1px solid #ebeef5; text-align: center; font-size: 13px; }
  td { padding: 12px 8px; border-bottom: 1px solid #ebeef5; text-align: center; }
  .ph { display: inline-block; height: 12px; background: #e4e7ed; border-radius: 3px; vertical-align: middle; }
  .checkbox { display: inline-block; width: 14px; height: 14px; border: 1px solid #dcdfe6; border-radius: 2px; background: #fff; }
  .switch { display: inline-block; width: 36px; height: 18px; border-radius: 9px; background: #409EFF; position: relative; }
  .switch::after { content: ""; position: absolute; right: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; }
  .link { color: #409EFF; margin: 0 4px; }
  .pager { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 16px 0 4px; color: #606266; font-size: 12px; }
  .pg { width: 26px; height: 26px; line-height: 24px; text-align: center; border: 1px solid #dcdfe6; border-radius: 4px; background: #fff; }
  .pg.on { background: #409EFF; border-color: #409EFF; color: #fff; }
  .note { color: #909399; font-size: 12px; padding: 10px 20px; }
</style>
</head>
<body>
<div class="ai-banner">&#9888; AI 根据源码重建的结构示意图，非真实运行截图</div>
<div class="page">
  <!-- 搜索栏 -->
  <div class="search-bar">
    <div class="field"><label>用户名称</label><div class="input">请输入用户名称</div></div>
    <div class="field"><label>手机号码</label><div class="input">请输入手机号码</div></div>
    <div class="field"><label>状态</label><div class="input select">用户状态</div></div>
    <div class="field"><label>创建时间</label><div class="input" style="width:220px">开始日期 &nbsp;-&nbsp; 结束日期</div></div>
    <span class="btn btn-primary">搜索</span>
    <span class="btn">重置</span>
  </div>
  <!-- 操作按钮区 -->
  <div class="toolbar">
    <span class="btn btn-primary">+ 新增</span>
    <span class="btn btn-success">修改</span>
    <span class="btn btn-danger">删除</span>
    <span class="btn btn-info">导入</span>
    <span class="btn btn-warning">导出</span>
  </div>
  <!-- 表格 -->
  <table>
    <thead>
      <tr>
        <th style="width:50px"><span class="checkbox"></span></th>
        <th>用户编号</th>
        <th>用户名称</th>
        <th>用户昵称</th>
        <th>系统角色</th>
        <th style="width:120px">手机号码</th>
        <th>状态</th>
        <th style="width:160px">创建时间</th>
        <th style="width:180px">操作</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td><span class="checkbox"></span></td>
        <td><span class="ph" style="width:40px"></span></td>
        <td><span class="ph" style="width:70px"></span></td>
        <td><span class="ph" style="width:70px"></span></td>
        <td><span class="ph" style="width:80px"></span></td>
        <td><span class="ph" style="width:90px"></span></td>
        <td><span class="switch"></span></td>
        <td><span class="ph" style="width:110px"></span></td>
        <td><span class="link">修改</span><span class="link">删除</span><span class="link">重置</span></td>
      </tr>
      <tr>
        <td><span class="checkbox"></span></td>
        <td><span class="ph" style="width:40px"></span></td>
        <td><span class="ph" style="width:70px"></span></td>
        <td><span class="ph" style="width:70px"></span></td>
        <td><span class="ph" style="width:80px"></span></td>
        <td><span class="ph" style="width:90px"></span></td>
        <td><span class="switch"></span></td>
        <td><span class="ph" style="width:110px"></span></td>
        <td><span class="link">修改</span><span class="link">删除</span><span class="link">重置</span></td>
      </tr>
    </tbody>
  </table>
  <!-- 分页器 -->
  <div class="pager">
    <span>共 <b>—</b> 条</span>
    <span class="pg">‹</span><span class="pg on">1</span><span class="pg">2</span><span class="pg">3</span><span class="pg">›</span>
    <div class="input select" style="width:90px;height:26px;line-height:24px;font-size:12px">10条/页</div>
  </div>
</div>
<div class="note">说明：页面还包含「新增/修改用户」弹窗（含归属部门树选择）和「用户导入」上传弹窗，此处未绘制。</div>
</body>
</html>
