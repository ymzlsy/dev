<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Karaithy Dev · 客户代码看板</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink:#1a1a2e; --ink2:#4b5563; --ink3:#9ca3af; --line:#e8eaf0; --bg:#fbfbfd; --panel:#fff;
    --brand:#d97706; --brand-hover:#f59e0b; --brand-soft:#fff7ed; --blue:#2563eb;
    --shadow:0 1px 3px rgba(20,20,40,.05),0 8px 28px rgba(20,20,40,.06);
    --shadow-hover:0 4px 12px rgba(20,20,40,.08),0 18px 48px rgba(20,20,40,.1);
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Noto Sans SC',system-ui,sans-serif; color:var(--ink); background:var(--bg); line-height:1.7; -webkit-font-smoothing:antialiased; }
  .topbar { position:sticky; top:0; z-index:50; background:rgba(251,251,253,.85); backdrop-filter:saturate(160%) blur(12px); border-bottom:1px solid var(--line); }
  .topbar-inner { max-width:1080px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; gap:16px; }
  .brand-mark { font-weight:800; font-size:19px; letter-spacing:-.5px; }
  .brand-mark .ai { color:var(--brand); }
  .topbar nav { margin-left:auto; display:flex; gap:20px; font-size:14px; }
  .topbar nav a { color:var(--ink2); text-decoration:none; font-weight:500; }
  .topbar nav a:hover { color:var(--brand); }
  .wrap { max-width:1080px; margin:0 auto; padding:0 24px; }
  .hero { padding:64px 0 40px; }
  .hero .eyebrow { display:inline-block; font-size:13px; font-weight:600; letter-spacing:2px; color:var(--brand); text-transform:uppercase; margin-bottom:14px; }
  .hero h1 { font-size:38px; line-height:1.18; margin:0 0 14px; letter-spacing:-.5px; }
  .hero .lead { font-size:17px; color:var(--ink2); max-width:680px; margin:0; }
  .section-eyebrow { font-size:13px; font-weight:600; letter-spacing:1.5px; color:var(--ink3); text-transform:uppercase; margin:10px 0 6px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:20px; padding:8px 0 60px; }
  .card { display:block; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:24px; box-shadow:var(--shadow); transition:transform .2s,box-shadow .2s,border-color .2s; color:inherit; text-decoration:none; }
  .card:hover { transform:translateY(-3px); box-shadow:var(--shadow-hover); border-color:#e2c9a0; }
  .card .ico { width:46px; height:46px; border-radius:11px; background:var(--brand-soft); display:flex; align-items:center; justify-content:center; font-size:22px; margin-bottom:14px; }
  .card h3 { margin:0 0 6px; font-size:18px; }
  .card .meta { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .card .tag { font-size:11.5px; padding:2px 9px; border-radius:20px; background:#f1f3f8; color:var(--ink2); }
  .card .tag.b { background:var(--brand-soft); color:var(--brand); font-weight:600; }
  .card p { margin:0 0 12px; font-size:13.5px; color:var(--ink2); }
  .card .stat { display:flex; gap:16px; font-size:12.5px; color:var(--ink3); border-top:1px solid var(--line); padding-top:10px; }
  .card .stat b { color:var(--ink); font-weight:600; }
  .card .arrow { margin-top:10px; font-size:13px; color:var(--brand); font-weight:600; }
  .card.placeholder { border-style:dashed; box-shadow:none; background:transparent; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; color:var(--ink3); min-height:170px; }
  .card.placeholder:hover { transform:none; }
  .note { background:var(--brand-soft); border-left:3px solid var(--brand); border-radius:0 10px 10px 0; padding:14px 18px; font-size:13.5px; color:#7c4a08; margin:8px 0 28px; }
  footer { border-top:1px solid var(--line); padding:28px 0; font-size:13px; color:var(--ink3); }
  footer .wrap { display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <span class="brand-mark">Kar<span class="ai">ai</span>thy <span style="color:var(--ink3);font-weight:500;font-size:14px">Dev</span></span>
    <nav>
      <a href="./status" style="color:var(--brand);font-weight:600">📊 项目状态</a>
      <a href="https://tools.karaithy.com" target="_blank">Tools</a>
      <a href="https://wiki.karaithy.com" target="_blank">Wiki</a>
    </nav>
  </div>
</div>

<header class="hero wrap">
  <span class="eyebrow">客户代码看板</span>
  <h1>每个客户的代码，<br>翻译成产品看得懂的样子。</h1>
  <p class="lead">
    我们按客户做定制，每个客户一个分支。这里把每个在做的客户代码解读成产品视角的功能地图——
    菜单、页面、字段、数据来源一目了然。拉一次最新代码，就能看到那个客户当前的功能全貌。
  </p>
</header>

<section class="wrap">
  <div class="note">
    🔒 本看板含客户系统内部细节，已加访问保护。当前为内部使用。
  </div>
  <div class="section-eyebrow">在做的客户 / 项目</div>
  <div class="grid" id="grid"><div style="color:var(--ink3);padding:20px">加载中…</div></div>
</section>

<footer>
  <div class="wrap">
    <span class="brand-mark">Kar<span class="ai">ai</span>thy Dev</span>
    <span>· 客户代码看板</span>
    <span style="margin-left:auto;color:var(--ink3)">数据来源：客户前端源码静态提取 + AI 产品语言增强</span>
  </div>
</footer>

<script>
fetch('./map/data/clients.json').then(r => r.json()).then(cfg => {
  const clients = cfg.clients || [];
  const grid = document.getElementById('grid');
  grid.innerHTML = clients.map(c => `
    <a class="card" href="./map/?c=${encodeURIComponent(c.key)}">
      <div class="ico">🗺️</div>
      <div class="meta">
        <span class="tag b">功能地图</span>
        <span class="tag">分支 ${c.branch || '—'}</span>
      </div>
      <h3>${c.name}</h3>
      <p>${c.desc || ''}</p>
      <div class="stat">
        <span><b>${c.moduleCount ?? '—'}</b> 模块</span>
        <span><b>${c.pageCount ?? '—'}</b> 页面</span>
        <span><b>${c.endpointCount ?? '—'}</b> 接口</span>
      </div>
      <div class="arrow">查看功能地图 →</div>
    </a>
  `).join('') + `
    <div class="card placeholder">
      <div style="font-size:26px;margin-bottom:8px">＋</div>
      <div>拉到新客户分支后，按 REGEN.md<br>增量分析，就会出现在这里</div>
    </div>`;
}).catch(e => {
  document.getElementById('grid').innerHTML = '<div style="color:#dc2626;padding:20px">加载 clients.json 失败：' + e + '</div>';
});
</script>
</body>
</html>
